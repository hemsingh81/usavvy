name: usavvy

# AD-11: only stateful dependencies are containerized. Every services/* process and
# apps/web run natively via `pnpm dev` for fast HMR — see root package.json.
services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: usavvy
      POSTGRES_PASSWORD: usavvy
      # AD-14: database-per-service. This is the default/admin database; each service's
      # own database (e.g. usavvy_core) is created by init-db.sh below.
      POSTGRES_DB: usavvy
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usavvy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: server -s3 -s3.port=8333 -dir=/data -ip.bind=0.0.0.0
    ports:
      - "8333:8333"
      - "9333:9333"
    volumes:
      - seaweedfs-data:/data

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
